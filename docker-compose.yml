services:
  postgres:
    image: postgres:18
    command: postgres -c log_lock_waits=on -c log_min_duration_statement=100
    shm_size: 128mb
    environment:
      POSTGRES_DB: django
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres"]
      start_period: 30s
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      start_period: 30s
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  minio:
    # MinIO deleted `minio/minio` from Docker Hub on 2026-09-11 and made
    # `quay.io/minio/minio` require a login on 2026-09-24.  Use the frozen
    # Bitnami build our CI already runs; it starts the server on its own,
    # keeping data under /bitnami/minio/data.  It has no web console.
    # See https://github.com/dandi/dandi-infrastructure/issues/289 for
    # hosting a copy of our own.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioAccessKey
      MINIO_ROOT_PASSWORD: minioSecretKey
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      # "mc ready" doesn't terminate on failure, so time it out
      timeout: 1s
      start_period: 30s
    ports:
      - 9000:9000
    volumes:
      - minio:/bitnami/minio/data

volumes:
  postgres:
  minio:
  rabbitmq:
