name: Test Integration with dandi-cli

on:
  push:
    branches:
      - master
    paths-ignore:
      - "web/**"
  pull_request:
    paths-ignore:
      - "web/**"

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetch history for all branches and tags

      - name: Build Docker image
        run: |
          docker build \
            -t dandiarchive/dandiarchive-api \
            -f dev/django-public.Dockerfile \
            .

      - name: Export Docker image
        run: |
          docker image save -o dandiarchive-api.tgz dandiarchive/dandiarchive-api

      - name: Upload Docker image tarball
        uses: actions/upload-artifact@v7
        with:
          name: dandiarchive-api.tgz
          path: dandiarchive-api.tgz

  test:
    runs-on: ubuntu-24.04
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.13"
        dandi-version:
          - release
          - master
    env:
      DANDI_TESTS_PULL_DOCKER_COMPOSE: 0
    steps:
      - name: Download Docker image tarball
        uses: actions/download-artifact@v8
        with:
          name: dandiarchive-api.tgz

      - name: Import Docker image
        run: docker image load -i dandiarchive-api.tgz

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # MinIO made quay.io/minio/minio require a login on 2026-09-24, and
      # dandi-cli's compose file still pulls it.  Layer the image our own
      # docker-compose.yml uses over it until dandi-cli carries
      # https://github.com/dandi/dandi-cli/pull/1927 (in `master` and in a
      # release); the override is a no-op after that.
      - name: Override MinIO image in dandi-cli's compose file
        run: |
          cat > "$RUNNER_TEMP/minio-override.yml" <<'EOF'
          services:
            minio:
              image: bitnamilegacy/minio:latest
              command: !reset []
              tty: !reset false
          EOF
          echo "COMPOSE_FILE=docker-compose.yml:$RUNNER_TEMP/minio-override.yml" >> "$GITHUB_ENV"

      - name: Run dandi-api tests in dandi-cli
        if: matrix.dandi-version == 'release'
        run: >
          uvx --with dandi[test]
          pytest --pyargs -v -s --dandi-api dandi
        env:
          DANDI_TESTS_PERSIST_DOCKER_COMPOSE: "1"

      - name: Run dandi-api tests in dandi-cli
        if: matrix.dandi-version == 'master'
        run: >
          uvx --with "dandi[test] @ git+https://github.com/dandi/dandi-cli"
          pytest --pyargs -v -s --dandi-api dandi
        env:
          DANDI_TESTS_PERSIST_DOCKER_COMPOSE: "1"

      - name: Dump Docker Compose logs
        if: failure()
        run: |
          DANDI_PATH=$(uv run --with dandi python -c "import dandi; import os; print(os.path.dirname(dandi.__file__))")
          docker compose \
            -f "$DANDI_PATH/tests/data/dandiarchive-docker/docker-compose.yml" \
            logs --timestamps

      - name: Shut down Docker Compose
        run: |
          DANDI_PATH=$(uv run --with dandi python -c "import dandi; import os; print(os.path.dirname(dandi.__file__))")
          docker compose \
            -f "$DANDI_PATH/tests/data/dandiarchive-docker/docker-compose.yml" \
            down -v
